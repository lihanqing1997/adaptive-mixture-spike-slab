[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-mixture-spike-slab"
version = "0.1.0"
description = "Adaptive mixture variational inference for spike-and-slab regression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
reproduce = ["matplotlib>=3.9"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
